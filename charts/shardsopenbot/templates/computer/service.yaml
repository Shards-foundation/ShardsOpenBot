{{- if eq .Values.computers.mode "shared" }}
{{- $component := "computer" -}}
{{/* Headless, because a StatefulSet wants stable per-pod names rather than a load-balanced one. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shardsopenbot.componentName" (dict "root" . "component" $component) }}
  labels:
{{ include "shardsopenbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 4100
      targetPort: http
      protocol: TCP
      name: http
  selector:
{{ include "shardsopenbot.componentSelectorLabels" (dict "root" . "component" $component) | indent 4 }}
{{- end }}
